platform:
  type: ZephyrPlatform
  parameters:
    name: stm32f746g_disco
    simulated: true
    zephyr_build_path: ./build
    # HiFive boards have very noisy UART handlers in RENODE, and in Kenning
    # Zephyr Runtime we run the kcomms UART in polling mode, therefore the
    # amount of Renode logs generated would overwhelm Kenning. For that reason
    # we suppress UART-related warnings for that port.
    post_start_commands:
      - "logLevel 3 sysbus.uart1"
dataset:
  type: MagicWandDataset
  parameters:
    dataset_root: ./output/MagicWandDataset
model_wrapper:
  type: MagicWandModelWrapper
  parameters:
    model_path: kenning:///models/classification/magic_wand.h5
optimizers:
- type: TFLiteCompiler
  parameters:
    compiled_model_path: ./output/magic-wand.tflite
    inference_input_type: int8
    inference_output_type: int8
